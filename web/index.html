<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicOps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4e5f'/%3E%3Cpath d='M16 6 6 12v2h20v-2zM8 16h3v8H8zm6.5 0h3v8h-3zM21 16h3v8h-3zM6 25h20v2H6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6"/><path d="M16 6 6 12v2h20v-2zM8 16h3v8H8zm6.5 0h3v8h-3zM21 16h3v8h-3zM6 25h20v2H6z"/></svg>CivicOps</div>
    <nav id="nav" aria-label="Sections">
      <button data-view="jobs">Jobs</button>
      <button data-view="employers">Employers</button>
      <button data-view="tracker">Tracker</button>
      <button data-view="ai">AI models</button>
      <button data-view="setup">Setup</button>
    </nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="drawerWrap" class="drawer-wrap" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Job details"></section>
</div>
<div id="taskBar" class="taskbar" role="status" aria-live="polite" hidden></div>
<div id="toast" class="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
